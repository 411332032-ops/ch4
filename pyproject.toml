[project]
name = "foodbot"
version = "0.1.0"
description = "Discord bot：收食物照片，用 claude -p 估熱量並記錄到 Excel"
requires-python = ">=3.12"
dependencies = [
    "discord-py>=2.7.1",
    "openpyxl>=3.1.5",
    "pillow>=13.0.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
foodbot = "foodbot.main:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
